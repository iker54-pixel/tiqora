workflows:
  android-workflow:
    name: Android Workflow
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: Generar carpetas de la plataforma
        script: |
          flutter create --platforms=android .
      - name: Activar desugaring en Android
        script: |
          python3 -c "
          path = 'android/app/build.gradle.kts'
          with open(path) as f:
              content = f.read()
          content = content.replace(
              'android {',
              'android {\n    compileOptions {\n        isCoreLibraryDesugaringEnabled = true\n    }',
              1
          )
          content += '\ndependencies {\n    coreLibraryDesugaring(\"com.android.tools:desugar_jdk_libs:2.0.4\")\n}\n'
          with open(path, 'w') as f:
              f.write(content)
          print('Archivo modificado correctamente')
          "
          cat android/app/build.gradle.kts
      - name: Descargar dependencias
        script: |
          flutter pub get
      - name: Compilar APK
        script: |
          flutter build apk --debug
    artifacts:
      - build/**/outputs/**/*.apk
