workflows:
  android-workflow:
    name: Android Workflow
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: Generar carpetas de la plataforma
        script: |
          flutter create --platforms=android .
      - name: Descargar dependencias
        script: |
          flutter pub get
      - name: Compilar APK
        script: |
          flutter build apk --debug
    artifacts:
      - build/**/outputs/**/*.apk
